# クラスターの設定ファイル（eksctl の ClusterConfig）
# 作る:   eksctl create cluster -f cluster.yaml
# 消す:   eksctl delete cluster -f cluster.yaml --wait
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-course            # クラスターの名前
  region: ap-northeast-1      # 東京
  version: "1.36"              # Kubernetes の版（第7章で更新する）
  tags:
    course: eks-course        # 作ったものに付く目印（片付けの確認に使う）

vpc:
  nat:
    gateway: Single           # NAT ゲートウェイは1つ（ノードが外へ出る道。費用がかかる）

accessConfig:
  authenticationMode: API     # 権限はアクセスエントリで管理する（aws-auth は使わない）

addonsConfig:
  autoApplyPodIdentityAssociations: true   # アドオンに必要な権限を Pod Identity で自動で付ける

addons:                       # version: latest = そのときの版で使える最新
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: eks-pod-identity-agent
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
  - name: metrics-server
    version: latest

managedNodeGroups:
  - name: ng-1
    instanceType: t3.medium   # 2 vCPU・4 GiB
    desiredCapacity: 2
    minSize: 2
    maxSize: 3                # 更新のときに一時的に3台になる
    volumeSize: 20           # ノードのディスク（GiB）
    privateNetworking: true   # ノードはプライベートサブネットに置く
