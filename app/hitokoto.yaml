# 掲示板アプリ（ECR に置いた自分のイメージ）。IMAGE_URI は apply のときに置き換える
#   sed "s|IMAGE_URI|$IMAGE|" app/hitokoto.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hitokoto
  namespace: hitokoto
  labels:
    app: hitokoto
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hitokoto
  template:
    metadata:
      labels:
        app: hitokoto
    spec:
      terminationGracePeriodSeconds: 40     # preStop の20秒より長く
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: IMAGE_URI
          lifecycle:
            preStop:
              sleep:
                seconds: 20               # ALB がこの Pod へ送るのをやめるまで待ってから止まる
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hitokoto
  namespace: hitokoto
spec:
  selector:
    app: hitokoto
  ports:
    - port: 80
      targetPort: 8000
